{% extends "layout.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 30px;">
        <a href="{{ url_for('suppliers') }}" class="btn-secondary" style="display: flex; align-items: center; gap: 5px;">
            <i class='bx bx-arrow-back'></i> Back
        </a>
        <h1 style="margin: 0;"><i class='bx bx-plus-circle'></i> Add New Supplier</h1>
    </div>

    <div class="card">
        <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label style="color: var(--electric-cyan); font-weight: 600; display: block; margin-bottom: 8px;">Supplier Name *</label>
                <input type="text" name="name" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--cobalt-blue); color: white; border-radius: 6px;" placeholder="Enter supplier name">
            </div>
            
            <div>
                <label style="color: var(--electric-cyan); font-weight: 600; display: block; margin-bottom: 8px;">Contact Person</label>
                <input type="text" name="contact_person" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--cobalt-blue); color: white; border-radius: 6px;" placeholder="Full name">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label style="color: var(--electric-cyan); font-weight: 600; display: block; margin-bottom: 8px;">Email</label>
                    <input type="email" name="email" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--cobalt-blue); color: white; border-radius: 6px;" placeholder="supplier@example.com">
                </div>
                <div>
                    <label style="color: var(--electric-cyan); font-weight: 600; display: block; margin-bottom: 8px;">Phone</label>
                    <input type="tel" name="phone" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--cobalt-blue); color: white; border-radius: 6px;" placeholder="+63 912 345 6789">
                </div>
            </div>

            <div>
                <label style="color: var(--electric-cyan); font-weight: 600; display: block; margin-bottom: 8px;">Address</label>
                <textarea name="address" rows="3" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--cobalt-blue); color: white; border-radius: 6px; resize: vertical;" placeholder="Street address, city, postal code"></textarea>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button type="submit" class="btn-primary">
                    <i class='bx bx-save'></i> Save Supplier
                </button>
                <a href="{{ url_for('suppliers') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
