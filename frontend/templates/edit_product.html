{% extends "layout.html" %}
{% block content %}
<div style="margin-bottom: 30px;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('inventory') }}" class="btn-secondary" style="display: flex; align-items: center; gap: 5px;">
            <i class='bx bx-arrow-back'></i> Back to Inventory
        </a>
        <h1 style="margin: 0;"><i class='bx bx-edit'></i> Edit Product</h1>
    </div>
</div>

<div class="card">
    <form action="/inventory/edit/{{ product.id }}" method="POST" class="product-form">
        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-info-circle'></i> Basic Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required>
                </div>
                <div class="form-group">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" name="sku" value="{{ product.sku }}" readonly>
                    <small style="color: var(--text-dim);">SKU cannot be changed</small>
                </div>
                <div class="form-group">
                    <label for="barcode">Barcode</label>
                    <input type="text" id="barcode" name="barcode" value="{{ product.barcode }}">
                </div>
                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {{ 'selected' if cat.id == product.category_id else '' }}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="unit_id">Unit *</label>
                    <select id="unit_id" name="unit_id" required>
                        <option value="">Select Unit</option>
                        {% for unit in units %}
                        <option value="{{ unit.id }}" {{ 'selected' if unit.id == product.unit_id else '' }}>
                            {{ unit.unit_name }} ({{ unit.abbreviation or unit.unit_name }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="supplier_id">Supplier</label>
                    <select id="supplier_id" name="supplier_id">
                        <option value="">Select Supplier</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}" {{ 'selected' if supplier.id == product.supplier_id else '' }}>{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group full-width">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3">{{ product.description or '' }}</textarea>
            </div>
        </div>

        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-package'></i> Inventory Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="min_stock_level">Minimum Stock Level</label>
                    <input type="number" id="min_stock_level" name="min_stock_level" min="0" step="0.01"
                           value="{{ product.min_stock_level }}">
                    <small style="color: var(--text-dim);">Alert when stock falls below this level</small>
                </div>
                <div class="form-group">
                    <label for="max_stock_level">Maximum Stock Level</label>
                    <input type="number" id="max_stock_level" name="max_stock_level" min="0" step="0.01"
                           value="{{ product.max_stock_level }}">
                    <small style="color: var(--text-dim);">Optional upper limit for stock</small>
                </div>
                <div class="form-group">
                    <label for="location">Storage Location</label>
                    <input type="text" id="location" name="location" value="{{ product.location or '' }}"
                           placeholder="e.g., Warehouse A, Shelf 3">
                </div>
                <div class="form-group">
                    <label for="batch_number">Batch Number</label>
                    <input type="text" id="batch_number" name="batch_number" value="{{ product.batch_number or '' }}">
                </div>
                <div class="form-group">
                    <label for="expiry_date">Expiry Date</label>
                    <input type="date" id="expiry_date" name="expiry_date"
                           value="{{ product.expiry_date.strftime('%Y-%m-%d') if product.expiry_date else '' }}">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="active" {{ 'selected' if product.status == 'active' else '' }}>Active</option>
                        <option value="inactive" {{ 'selected' if product.status == 'inactive' else '' }}>Inactive</option>
                        <option value="discontinued" {{ 'selected' if product.status == 'discontinued' else '' }}>Discontinued</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-money'></i> Pricing Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="cost_price">Cost Price (₱) *</label>
                    <input type="number" id="cost_price" name="cost_price" min="0" step="0.01"
                           value="{{ product.cost_price }}" required>
                </div>
                <div class="form-group">
                    <label for="selling_price">Selling Price (₱) *</label>
                    <input type="number" id="selling_price" name="selling_price" min="0" step="0.01"
                           value="{{ product.selling_price }}" required>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">
                <i class='bx bx-save'></i> Update Product
            </button>
            <a href="{{ url_for('inventory') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Form validation
    document.querySelector('.product-form').addEventListener('submit', function(e) {
        const cost = parseFloat(document.getElementById('cost_price').value);
        const selling = parseFloat(document.getElementById('selling_price').value);

        if (selling < cost) {
            alert('Selling price should be higher than cost price');
            e.preventDefault();
            return false;
        }
    });
});
</script>

<style>
.form-section {
    margin-bottom: 30px;
    padding: 20px;
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-group label {
    margin-bottom: 5px;
    color: var(--electric-cyan);
    font-weight: 500;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 10px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--cobalt-blue);
    border-radius: 4px;
    color: white;
    font-size: 14px;
}

.form-group input[readonly] {
    background: rgba(0, 0, 0, 0.4);
    cursor: not-allowed;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--electric-cyan);
    box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2);
}

.form-group small {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-dim);
}

.form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding-top: 20px;
    border-top: 1px solid rgba(0, 255, 136, 0.2);
}
</style>
{% endblock %}
