{% extends "layout.html" %}
{% block content %}
<div style="margin-bottom: 30px;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('inventory') }}" class="btn-secondary" style="display: flex; align-items: center; gap: 5px;">
            <i class='bx bx-arrow-back'></i> Back to Inventory
        </a>
        <h1 style="margin: 0;"><i class='bx bx-plus-circle'></i> Add New Product</h1>
    </div>
</div>

<div class="card">
    <form action="/inventory/add" method="POST" class="product-form">
        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-info-circle'></i> Basic Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input type="text" id="name" name="name" required placeholder="Enter product name">
                </div>
                <div class="form-group">
                    <label for="category_id">Category *</label>
                    <select id="category_id" name="category_id" required>
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="unit_id">Unit *</label>
                    <select id="unit_id" name="unit_id" required>
                        <option value="">Select Unit</option>
                        {% for unit in units %}
                        <option value="{{ unit.id }}">{{ unit.unit_name }} ({{ unit.abbreviation or unit.unit_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="supplier_id">Supplier</label>
                    <select id="supplier_id" name="supplier_id">
                        <option value="">Select Supplier</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" name="sku" placeholder="Auto-generated if empty">
                    <small style="color: var(--text-dim);">Leave blank to auto-generate</small>
                </div>
                <div class="form-group">
                    <label for="barcode">Barcode</label>
                    <input type="text" id="barcode" name="barcode" placeholder="Scan or enter barcode">
                    <small style="color: var(--text-dim);">Leave blank to auto-generate</small>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-package'></i> Inventory Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="quantity">Initial Quantity *</label>
                    <input type="number" id="quantity" name="quantity" min="0" step="1" required placeholder="0">
                </div>
                <div class="form-group">
                    <label for="min_stock_level">Minimum Stock Level</label>
                    <input type="number" id="min_stock_level" name="min_stock_level" min="0" step="1" placeholder="0">
                    <small style="color: var(--text-dim);">Set when stock should trigger a low-stock alert</small>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 style="color: var(--electric-cyan); margin-bottom: 20px;"><i class='bx bx-money'></i> Pricing Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="cost_price">Cost Price (₱) *</label>
                    <input type="number" id="cost_price" name="cost_price" min="0" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="selling_price">Selling Price (₱) *</label>
                    <input type="number" id="selling_price" name="selling_price" min="0" step="0.01" required placeholder="0.00">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">
                <i class='bx bx-save'></i> Save Product
            </button>
            <a href="{{ url_for('inventory') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-generate SKU and Barcode
    document.getElementById('name').addEventListener('input', function() {
        const name = this.value;
        if (name && !document.getElementById('sku').value) {
            // Simple SKU generation based on name
            const sku = 'SKU-' + name.substring(0, 3).toUpperCase() + Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('sku').value = sku;
        }
    });

    // Calculate suggested selling price (cost * 1.3)
    document.getElementById('cost_price').addEventListener('input', function() {
        const cost = parseFloat(this.value);
        const sellingInput = document.getElementById('selling_price');
        if (cost > 0 && !sellingInput.value) {
            sellingInput.value = (cost * 1.3).toFixed(2);
        }
    });

    // Form validation
    document.querySelector('.product-form').addEventListener('submit', function(e) {
        const cost = parseFloat(document.getElementById('cost_price').value);
        const selling = parseFloat(document.getElementById('selling_price').value);

        if (selling < cost) {
            alert('Selling price should be higher than cost price');
            e.preventDefault();
            return false;
        }
    });
});
</script>

<style>
.form-section {
    margin-bottom: 30px;
    padding: 20px;
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.form-group label {
    margin-bottom: 5px;
    color: var(--electric-cyan);
    font-weight: 500;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 10px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--cobalt-blue);
    border-radius: 4px;
    color: white;
    font-size: 14px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--electric-cyan);
    box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2);
}

.form-group small {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-dim);
}

.form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding-top: 20px;
    border-top: 1px solid rgba(0, 255, 136, 0.2);
}
</style>
{% endblock %}
